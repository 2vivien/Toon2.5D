name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --sort build
      - run: pnpm -r --sort typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm -r --if-present pack --dry-run

  asset-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate reference GLB
        run: blender --background --python assets/tools/build_reference_head.py
      - name: Validate reference GLB
        run: blender --background --python assets/tools/validate_reference_head.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vite build --config tests/browser/vite.config.mjs --outDir dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Release gates: frame-time p95, GPU timer, heap growth and WebGL context recovery\n        run: pnpm test:browser
